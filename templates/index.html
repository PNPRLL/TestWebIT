<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Media Downloader | Like sssinstagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-purple-500 selection:text-white pb-12">

    <div class="fixed top-0 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative w-full max-w-2xl bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl shadow-purple-950/20 mt-8">
        
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-purple-400 via-pink-500 to-cyan-400 bg-clip-text text-transparent mb-2">
                Media Downloader
            </h1>
            <p class="text-slate-400 text-sm">วางลิงก์วิดีโอจาก TikTok หรือ Instagram (Public) แล้วกดค้นหาได้เลย</p>
        </div>

        <div class="space-y-4">
            <div>
                <input type="text" id="url-input" placeholder="วางลิงก์ที่นี่ (เช่น https://www.instagram.com/p/...)" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-900/50 transition-all text-sm">
            </div>

            <button id="btn-action" onclick="startAction()" class="w-full bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 hover:opacity-90 text-slate-950 font-bold py-4 rounded-2xl shadow-lg shadow-purple-500/20 active:scale-[0.99] transition-all cursor-pointer text-center text-sm tracking-wide">
                🔍 ค้นหาไฟล์
            </button>

            <div id="status-box" class="hidden bg-slate-950 border border-slate-800 rounded-2xl p-4 text-center text-sm">
                <span id="status-text" class="text-purple-400">กำลังประมวลผล กรุณารอสักครู่...</span>
            </div>
        </div>

        <div id="media-preview" class="hidden mt-8 pt-6 border-t border-slate-800">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 text-center">⬇️ ผลลัพธ์การค้นหา</h3>
            <div id="media-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                </div>
        </div>
    </div>

    <script>
        async function startAction() {
            const url = document.getElementById('url-input').value;
            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');
            const btnAction = document.getElementById('btn-action');
            const mediaPreview = document.getElementById('media-preview');
            const mediaGrid = document.getElementById('media-grid');

            if (!url) {
                alert('กรุณาวางลิงก์ก่อนครับ!');
                return;
            }

            statusBox.classList.remove('hidden');
            mediaPreview.classList.add('hidden');
            mediaGrid.innerHTML = '';
            btnAction.disabled = true;
            btnAction.style.opacity = 0.5;
            
            statusText.className = "text-cyan-400 animate-pulse";
            statusText.innerText = "⚡ ระบบกำลังเข้าไปดึงข้อมูลจากลิงก์...";

            try {
                const response = await fetch('/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    statusBox.classList.add('hidden');
                    mediaPreview.classList.remove('hidden');

                    data.media.forEach((item) => {
                        const card = document.createElement('div');
                        card.className = "bg-slate-800 border border-slate-700 rounded-xl overflow-hidden relative group aspect-square flex flex-col";
                        
                        const imgBox = document.createElement('div');
                        imgBox.className = "relative flex-1 bg-slate-900";
                        
                        const img = document.createElement('img');
                        img.src = item.thumbnail || 'https://via.placeholder.com/300?text=No+Thumbnail';
                        img.className = "w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity";
                        
                        const badge = document.createElement('div');
                        badge.className = "absolute top-2 right-2 bg-slate-950/80 rounded-md px-2 py-1 text-xs z-10 text-white";
                        badge.innerHTML = item.type === 'video' ? '🎬 Video' : '📸 Image';

                        imgBox.appendChild(img);
                        imgBox.appendChild(badge);

                        // ปุ่มดาวน์โหลด (เปิดลิงก์ตรงไปยัง CDN)
                        const dlBox = document.createElement('div');
                        dlBox.className = "p-3 bg-slate-800";
                        
                        const dlBtn = document.createElement('a');
                        dlBtn.href = item.url;
                        dlBtn.target = "_blank"; // ให้เปิดแท็บใหม่เพื่อดาวน์โหลด
                        dlBtn.className = "block w-full text-center bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 text-white font-semibold py-2 rounded-lg text-sm transition-all";
                        dlBtn.innerHTML = "📥 ดาวน์โหลด";

                        dlBox.appendChild(dlBtn);
                        card.appendChild(imgBox);
                        card.appendChild(dlBox);
                        mediaGrid.appendChild(card);
                    });
                } else {
                    statusText.className = "text-red-400";
                    statusText.innerText = `❌ ${data.error || 'เกิดข้อผิดพลาด'}`;
                }
            } catch (error) {
                statusText.className = "text-red-400";
                statusText.innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
            } finally {
                btnAction.disabled = false;
                btnAction.style.opacity = 1;
            }
        }
    </script>
</body>
</html>
